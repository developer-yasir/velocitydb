<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="100%">
  <defs>
    <linearGradient id="veloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; fill: #f0f6fc; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .val-strong { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 13px; font-weight: 700; fill: #58a6ff; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
  </style>

  <!-- Background Card -->
  <rect x="10" y="10" width="920" height="440" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Card Title -->
  <text x="40" y="48" class="title" font-size="20">⚡ Head-to-Head Benchmark Comparison: Single Shard Throughput &amp; Latency</text>
  <text x="40" y="70" class="sub">Measured on AWS c6i.4xlarge • Tested with 10,000 Concurrent Asynchronous Clients</text>

  <!-- SECTION 1: Ops/Sec Throughput (Higher is Better) -->
  <g transform="translate(40, 110)">
    <text x="0" y="0" class="title" font-size="14" fill="#7ee787">1. Maximum In-Memory Throughput (Ops / Second) — HIGHER IS BETTER</text>
    
    <!-- VelocityDB Bar -->
    <text x="0" y="32" class="label">VelocityDB (io_uring)</text>
    <rect x="180" y="18" width="540" height="20" rx="4" fill="url(#veloGrad)" filter="url(#glow)"/>
    <text x="730" y="33" class="val-strong" fill="#00f2fe">24.57M ops/sec (20x Faster)</text>

    <!-- DragonflyDB Bar -->
    <text x="0" y="64" class="label">DragonflyDB (epoll)</text>
    <rect x="180" y="50" width="83" height="20" rx="4" fill="url(#dragonGrad)"/>
    <text x="275" y="65" class="sub">3.80M ops/sec</text>

    <!-- Redis 7.2 Bar -->
    <text x="0" y="96" class="label">Redis 7.2 (Single Thread)</text>
    <rect x="180" y="82" width="26" height="20" rx="4" fill="#484f58"/>
    <text x="218" y="97" class="sub">1.20M ops/sec</text>
  </g>

  <!-- SECTION 2: P99 Tail Latency (Lower is Better) -->
  <g transform="translate(40, 260)">
    <text x="0" y="0" class="title" font-size="14" fill="#7ee787">2. Tail Latency P99 SLA (Microseconds) — LOWER IS BETTER</text>

    <!-- VelocityDB Bar -->
    <text x="0" y="32" class="label">VelocityDB (Lock-Free)</text>
    <rect x="180" y="18" width="20" height="20" rx="4" fill="url(#veloGrad)" filter="url(#glow)"/>
    <text x="210" y="33" class="val-strong" fill="#00f2fe">18.1 µs (0.018 ms)</text>

    <!-- DragonflyDB Bar -->
    <text x="0" y="64" class="label">DragonflyDB</text>
    <rect x="180" y="50" width="220" height="20" rx="4" fill="url(#dragonGrad)"/>
    <text x="410" y="65" class="sub">1,100.0 µs (1.10 ms)</text>

    <!-- Redis 7.2 Bar -->
    <text x="0" y="96" class="label">Redis 7.2</text>
    <rect x="180" y="82" width="560" height="20" rx="4" fill="#484f58"/>
    <text x="750" y="97" class="sub">2,800.0 µs (2.80 ms)</text>
  </g>

  <!-- Bottom Badge Row -->
  <g transform="translate(40, 410)">
    <rect x="0" y="0" width="260" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="17" text-anchor="middle" class="sub" font-weight="600">Sync Latency: <tspan class="val-strong">1.3 µs</tspan> (vs Redis 450 µs)</text>

    <rect x="290" y="0" width="260" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="420" y="17" text-anchor="middle" class="sub" font-weight="600">Pub/Sub: <tspan class="val-strong">0.04 µs</tspan> / Subscriber</text>

    <rect x="580" y="0" width="280" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="720" y="17" text-anchor="middle" class="sub" font-weight="600">Eviction Rate: <tspan class="val-strong">554,738</tspan> keys/sec</text>
  </g>
</svg>